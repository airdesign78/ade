<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에어컨 용량 계산기 · (주)에이디이앤씨</title>
<meta name="description" content="면적만 입력하면 필요한 냉방능력(kW)을 바로 계산합니다. LG전자 시스템에어컨 인증점 (주)에이디이앤씨">
<meta property="og:title" content="에어컨 용량 계산기 · (주)에이디이앤씨">
<meta property="og:description" content="우리 집, 우리 매장에 필요한 냉방능력을 면적으로 계산해 보세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#243A70;--wine:#A50034;--bg:#F4F5F7;--line:#DDE1E8;--txt:#1F2430;--sub:#667085}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.hide{display:none!important}
header{background:var(--navy);color:#fff;padding:18px 18px 16px}
.hin{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;gap:10px}
header small{display:block;font-size:12px;color:#C9D2E8}
header h1{margin:3px 0 0;font-size:22px;letter-spacing:-.3px}
.blog{margin-left:auto;background:var(--wine);color:#fff;text-decoration:none;font-weight:700;font-size:13px;border-radius:9px;padding:8px 11px;white-space:nowrap}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.lbl{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.num{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:#fff;padding:12px 6px;font-weight:700;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.toggle button{border:none;background:#fff;padding:5px 11px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
.toggle button.on{background:var(--navy);color:#fff}
.room{display:grid;grid-template-columns:minmax(64px,90px) 1fr auto 28px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #F0F1F4}
.room input.nm{border:none;border-bottom:1px dashed #C9CED6;padding:4px 0;font-weight:700;width:100%;outline:none;background:transparent}
.area{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff}
.area:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,58,112,.12)}
.area input{border:none;outline:none;width:100%;padding:10px 0;font-size:16px;background:transparent}
.area .u{font-size:13px;color:#344054;font-weight:700;margin-left:4px}
.area .cv{font-size:11.5px;color:var(--sub);margin-left:8px;white-space:nowrap}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:#344054;cursor:pointer;user-select:none;white-space:nowrap}
.chk input{width:17px;height:17px;accent-color:var(--wine);margin:0}
.del{border:none;background:#F2F4F7;color:#667085;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px}
.add{margin-top:10px;width:100%;border:1px dashed #B8C0D0;background:#fff;border-radius:9px;padding:10px;font-size:13.5px;color:var(--navy);font-weight:700;cursor:pointer}
.info{background:#FFF7F9;border:1px solid #F3C9D5;border-radius:10px;padding:11px 12px;font-size:13px;line-height:1.65;color:#4A2230;margin-top:10px}
.info b{color:var(--wine)}
.unit{font-size:12px;color:var(--sub);margin-top:8px}
.opt{display:flex;gap:9px;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:8px;font-size:13px;line-height:1.5;color:#475467;cursor:pointer}
.opt.on{border-color:var(--navy);background:#F3F6FC}
.opt input{accent-color:var(--navy);width:17px;height:17px;margin:2px 0 0;flex:none}
.opt b{color:var(--navy);font-size:14px}
.go{width:100%;border:none;background:var(--wine);color:#fff;font-weight:800;border-radius:12px;padding:15px;font-size:16px;cursor:pointer;margin:6px 0 4px}
.err{color:var(--wine);font-size:13px;text-align:center;min-height:18px}

#result{scroll-margin-top:10px}
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:18px;margin-bottom:10px}
.hero small{color:#C9D2E8;font-size:13px}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:4px;line-height:1.25}
.hero .big em{font-style:normal;font-size:16px;color:#FFD3DF;margin-left:6px;white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pill{background:rgba(255,255,255,.14);border-radius:6px;padding:4px 9px;font-size:12.5px}
.cmp{display:flex;gap:8px}
.cmp div{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;color:#475467;line-height:1.5}
.cmp div.on{border-color:var(--navy);background:#F3F6FC}
.cmp b{display:block;color:var(--navy);font-size:17px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--sub);font-weight:600;text-align:left;padding:6px 3px;border-bottom:1px solid var(--line)}
td{padding:8px 3px;border-bottom:1px solid #F0F1F4;vertical-align:top}
.r{text-align:right}
.tag{background:#FFF1F3;color:var(--wine);border-radius:4px;padding:1px 5px;font-size:11px;font-weight:700;margin-left:4px;white-space:nowrap}
td small{color:var(--sub);display:block;font-size:11px}
.note{font-size:12.5px;color:#475467;line-height:1.65}
.cta{display:flex;gap:8px;margin:4px 0}
.cta a{flex:1;text-align:center;border-radius:11px;padding:13px 6px;font-weight:800;font-size:15px;text-decoration:none}
.cta .a{background:var(--wine);color:#fff}
.cta .b{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}
.again{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-weight:700;color:var(--navy);cursor:pointer;margin-top:6px}
.src{font-size:11.5px;color:#98A2B3;text-align:center;margin:12px 0 0;line-height:1.6}
</style>
</head>
<body>
<header><div class="hin">
  <div><small>(주)에이디이앤씨 · LG전자 시스템에어컨 인증점</small><h1>에어컨 용량 계산기</h1></div>
  <a class="blog" href="https://blog.naver.com/air-design" target="_top">블로그</a>
</div></header>

<main>
  <section id="input">
    <div class="card"><div class="lbl"><span class="num">1</span>공간 종류</div>
      <div class="seg" id="mode"><button data-m="home" class="on">🏠 주거</button><button data-m="biz">🏢 주거외시설</button></div>
    </div>

    <div class="card"><div class="lbl"><span class="num">2</span>공간별 면적
      <span class="toggle" id="unit"><button data-u="py" class="on">평</button><button data-u="m2">㎡ (헤베)</button></span></div>
      <div id="rooms"></div>
      <button class="add" id="add">+ 공간 추가</button>
      <div class="info" id="info"></div>
      <div class="unit" id="basis"></div>
    </div>

    <div class="card"><div class="lbl"><span class="num">3</span>실외기 연결 기준</div>
      <label class="opt" data-r="1"><input type="radio" name="ratio" value="1"><div><b>100% · 여유 있게</b><br>모든 공간을 동시에 최대로 틀어도 충분한 용량입니다.</div></label>
      <label class="opt on" data-r="1.3"><input type="radio" name="ratio" value="1.3" checked><div><b>130% · 효율적으로</b><br>모든 공간을 한꺼번에 최대로 쓰지 않는 생활 패턴을 고려해 실외기 용량을 줄여 봅니다. 모든 공간을 동시에 강하게 쓰면 냉방 속도가 다소 느려질 수 있습니다.</div></label>
    </div>

    <button class="go" id="calc">계산하기</button>
    <div class="err" id="err"></div>
  </section>

  <section id="result" class="hide"></section>
</main>

<script>
/* ═════════ 설정 — 숫자는 여기서만 바꾸면 됩니다 ═════════ */
const CONFIG = {
  LOAD: {            // W/㎡ (LG전자 평형 기준 환산)
    home: { base: 120, high: 150 },
    biz:  { base: 150, high: 180 },
  },
  KW_PER_HP: 2.8,    // 마력 참고 환산 (1마력 ≈ 2.8kW)
  PYEONG: 3.3058,    // 1평 = 3.3058㎡
  PHONE: '',         // 예: '02-000-0000'  (비우면 전화 버튼 숨김)
  TALK_URL: '',      // 예: 'https://talk.naver.com/…' (비우면 톡톡 버튼 숨김)
};
/* ═══════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_ROOMS = { home: ['거실', '안방', '방1', '방2'], biz: ['홀', '사무실'] };
const INFO = {
  home: ['남향·서향의 큰 통창이 있는 공간', '최상층 또는 지붕 바로 아래 공간', '발코니 확장 거실, 주방과 이어진 거실', '천장이 높은 공간 (약 2.7m 이상)'],
  biz:  ['사람이 많이 머무는 매장·학원·사무실', '큰 통유리 외벽이 있는 공간', '주방·조리 설비 등 열이 나는 기기가 있는 공간', '천장이 높은 공간 (약 2.7m 이상)'],
};
const S = { mode: 'home', unit: 'py', ratio: 1.3, rooms: [], shown: false };

function newRoom(name){ return { name, value: '', high: false }; }
function resetRooms(){ S.rooms = DEFAULT_ROOMS[S.mode].map(newRoom); }

/* ───── 화면 그리기 ───── */
function renderRooms(){
  $('#rooms').innerHTML = S.rooms.map((r, i) => `
    <div class="room">
      <input class="nm" value="${esc(r.name)}" data-i="${i}" data-k="name" maxlength="10" aria-label="공간 이름">
      <div class="area"><input inputmode="decimal" placeholder="0" value="${esc(r.value)}" data-i="${i}" data-k="value" aria-label="${esc(r.name)} 면적"><span class="u">${S.unit === 'py' ? '평' : '㎡'}</span><span class="cv" id="cv${i}">${convText(r.value)}</span></div>
      <label class="chk"><input type="checkbox" ${r.high ? 'checked' : ''} data-i="${i}" data-k="high">고부하</label>
      <button class="del" data-del="${i}" aria-label="삭제" ${S.rooms.length <= 1 ? 'disabled style="opacity:.3"' : ''}>✕</button>
    </div>`).join('');
  const L = CONFIG.LOAD[S.mode];
  $('#info').innerHTML = '<b>ⓘ 고부하는 이럴 때 체크하세요</b><br>' + INFO[S.mode].map(t => '· ' + esc(t)).join('<br>');
  $('#basis').textContent = S.mode === 'home'
    ? `적용 기준: 주거 기본 ${L.base}W/㎡ · 주거 고부하 ${L.high}W/㎡`
    : `적용 기준: 주거외시설 기본 ${L.base}W/㎡ · 주거외시설 고부하 ${L.high}W/㎡`;
}
function num(v){ const n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) && n > 0 ? n : 0; }
function toM2(v){ const n = num(v); return S.unit === 'py' ? n * CONFIG.PYEONG : n; }
function toPy(v){ const n = num(v); return S.unit === 'py' ? n : n / CONFIG.PYEONG; }
function convText(v){
  const n = num(v); if (!n) return '';
  return S.unit === 'py' ? `${fmt(n * CONFIG.PYEONG, 1)}㎡` : `${fmt(n / CONFIG.PYEONG, 1)}평`;
}
function fmt(n, d){ return (Math.round(n * 10 ** d) / 10 ** d).toLocaleString('ko-KR', { maximumFractionDigits: d }); }

/* 범위 표시: 3kW 이상은 1kW 단위, 미만은 0.5kW 단위 / 마력은 0.5 단위 */
function band(x, step){ const lo = Math.floor(x / step + 1e-9) * step; return [lo, lo + step]; }
function kwRange(x){ const [a, b] = band(x, x >= 3 ? 1 : 0.5); return `약 ${fmt(a, 1)}~${fmt(b, 1)}kW`; }
function hpRange(x){ const [a, b] = band(x / CONFIG.KW_PER_HP, 0.5); return `약 ${fmt(a, 1)}~${fmt(b, 1)}마력`; }

/* ───── 입력 이벤트 ───── */
$('#rooms').addEventListener('input', e => {
  const i = e.target.dataset.i, k = e.target.dataset.k; if (i == null) return;
  if (k === 'value') {
    e.target.value = e.target.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
    S.rooms[i].value = e.target.value;
    $('#cv' + i).textContent = convText(e.target.value);
  } else if (k === 'name') S.rooms[i].name = e.target.value;
  if (S.shown) calc(false);
});
$('#rooms').addEventListener('change', e => {
  const i = e.target.dataset.i;
  if (e.target.dataset.k === 'high') { S.rooms[i].high = e.target.checked; if (S.shown) calc(false); }
});
$('#rooms').addEventListener('click', e => {
  const d = e.target.closest('[data-del]'); if (!d || S.rooms.length <= 1) return;
  S.rooms.splice(+d.dataset.del, 1); renderRooms(); if (S.shown) calc(false);
});
$('#add').addEventListener('click', () => {
  if (S.rooms.length >= 20) return;
  S.rooms.push(newRoom((S.mode === 'home' ? '방' : '공간') + (S.rooms.length + 1)));
  renderRooms();
  const last = document.querySelectorAll('.area input'); last[last.length - 1].focus();
});
$('#mode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.m === S.mode) return;
  S.mode = b.dataset.m;
  document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b));
  resetRooms(); renderRooms(); hideResult();
});
$('#unit').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.u === S.unit) return;
  const to = b.dataset.u;
  S.rooms.forEach(r => {   // 입력한 숫자를 새 단위로 환산
    const n = num(r.value); if (!n) return;
    r.value = String(Math.round((to === 'm2' ? n * CONFIG.PYEONG : n / CONFIG.PYEONG) * 10) / 10);
  });
  S.unit = to;
  document.querySelectorAll('#unit button').forEach(x => x.classList.toggle('on', x === b));
  renderRooms(); if (S.shown) calc(false);
});
document.querySelectorAll('.opt').forEach(o => o.addEventListener('change', () => {
  S.ratio = +document.querySelector('input[name=ratio]:checked').value;
  document.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x.querySelector('input').checked));
  if (S.shown) calc(false);
}));
$('#calc').addEventListener('click', () => calc(true));

/* ───── 계산 ───── */
function calc(scroll){
  const L = CONFIG.LOAD[S.mode];
  const rows = S.rooms.map(r => {
    const m2 = toM2(r.value), py = toPy(r.value), w = r.high ? L.high : L.base;
    return { name: r.name.trim() || '공간', m2, py, w, high: r.high, kw: m2 * w / 1000 };
  }).filter(r => r.m2 > 0);
  if (!rows.length) { $('#err').textContent = '면적을 하나 이상 입력해 주세요.'; return; }
  if (rows.some(r => r.py > 3000)) { $('#err').textContent = '면적이 너무 큽니다. 숫자를 확인해 주세요.'; return; }
  $('#err').textContent = '';

  const sum = rows.reduce((a, r) => a + r.kw, 0);
  const sumM2 = rows.reduce((a, r) => a + r.m2, 0), sumPy = sumM2 / CONFIG.PYEONG;
  const r100 = sum, r130 = sum / 1.3;
  const areaTxt = S.unit === 'py' ? `총 면적 ${fmt(sumPy, 1)}평 (${fmt(sumM2, 1)}㎡)` : `총 면적 ${fmt(sumM2, 1)}㎡ (${fmt(sumPy, 1)}평)`;
  const who = S.mode === 'home' ? '우리 집에' : '우리 매장에';
  const phone = CONFIG.PHONE ? `<a class="a" href="tel:${esc(CONFIG.PHONE.replace(/[^\d+]/g, ''))}">📞 전화 상담</a>` : '';
  const talk = CONFIG.TALK_URL ? `<a class="b" href="${esc(CONFIG.TALK_URL)}" target="_blank" rel="noopener">💬 톡톡 상담</a>` : '';
  const ctaHtml = (phone || talk) ? `<div class="cta">${phone}${talk}</div>`
    : `<div class="cta"><a class="a" href="https://blog.naver.com/air-design" target="_top">블로그에서 상담 문의하기</a></div>`;

  $('#result').innerHTML = `
    <div class="hero"><small>${who} 필요한 냉방능력 (공간별 합계)</small>
      <div class="big">${kwRange(sum)}<em>${hpRange(sum)} (참고)</em></div>
      <div class="pills"><span class="pill">${S.mode === 'home' ? '주거' : '주거외시설'} · ${rows.length}개 공간</span><span class="pill">${areaTxt}</span></div></div>
    <div class="card"><div class="lbl">실외기 연결 기준별 참고 용량</div>
      <div class="cmp">
        <div class="${S.ratio === 1 ? 'on' : ''}">100% · 여유 있게${S.ratio === 1 ? ' ✓' : ''}<b>${kwRange(r100)}</b>${hpRange(r100)}</div>
        <div class="${S.ratio === 1.3 ? 'on' : ''}">130% · 효율적으로${S.ratio === 1.3 ? ' ✓' : ''}<b>${kwRange(r130)}</b>${hpRange(r130)}</div>
      </div></div>
    <div class="card"><div class="lbl">공간별 필요 용량</div>
      <table><tr><th>공간</th><th class="r">면적</th><th class="r">기준</th><th class="r">필요 용량</th></tr>
      ${rows.map(r => `<tr><td>${esc(r.name)}${r.high ? '<span class="tag">고부하</span>' : ''}</td>
        <td class="r">${S.unit === 'py' ? `${fmt(r.py, 1)}평<small>${fmt(r.m2, 1)}㎡</small>` : `${fmt(r.m2, 1)}㎡<small>${fmt(r.py, 1)}평</small>`}</td>
        <td class="r">${r.w}W</td><td class="r"><b>${kwRange(r.kw)}</b></td></tr>`).join('')}
      </table></div>
    <div class="card note">※ 면적과 사용 조건으로 계산한 <b>참고용 추정치</b>입니다. 창 크기, 단열, 층수, 사용 습관에 따라 실제 필요한 용량은 달라질 수 있으며, 제품과 용량은 <b>현장 실측 후</b> 안내드립니다.${S.mode === 'biz' ? '<br>※ 욕실 환기(바스에어)는 별도 상담으로 안내드립니다.' : ''}</div>
    ${ctaHtml}
    <button class="again" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 면적 다시 입력하기</button>
    <div class="src">부하 기준: LG전자 평형 기준 환산 (${S.mode === 'home' ? '주거' : '주거외시설'} 기본 ${L.base} · 고부하 ${L.high}W/㎡)<br>마력: 1마력 ≈ ${CONFIG.KW_PER_HP}kW 참고 환산 · 입력 내용은 저장되지 않습니다</div>`;
  $('#result').classList.remove('hide');
  S.shown = true;
  if (scroll) $('#result').scrollIntoView({ behavior: 'smooth' });
}
function hideResult(){ $('#result').classList.add('hide'); S.shown = false; }

resetRooms(); renderRooms();
</script>
</body>
</html>
